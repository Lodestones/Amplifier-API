name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # paper-api 1.21.4 ships Java 21 (class v65) bytecode — a 17 JDK can't read it.
          # Matches the JDK 21 pin in jitpack.yml; the pom's source/target 17 still applies.
          java-version: '21'
          distribution: 'temurin'
      - run: mvn clean package -B
      - id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          name: Amplifier API - v${{ steps.version.outputs.VERSION }}
          files: target/Amplifier-API-*.jar
          generate_release_notes: true
